version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nplusone-postgres
    environment:
      POSTGRES_DB: nplusone
      POSTGRES_USER: nplusone
      POSTGRES_PASSWORD: nplusone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
