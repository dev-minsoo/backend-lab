openapi: 3.0.3
info:
  title: Online QnA Service API
  version: 1.0.0
  description: API for the backend-lab online QnA service topic.
servers:
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Auth
  - name: Questions
  - name: Answers
  - name: Search
  - name: Profiles
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: 잘못된 요청입니다.
    SignUpRequest:
      type: object
      required: [email, nickname, password]
      properties:
        email:
          type: string
          format: email
        nickname:
          type: string
        password:
          type: string
      example:
        email: user1@example.com
        nickname: user1
        password: password1234
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: user1@example.com
        password: password1234
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
      example:
        id: 1
        email: user1@example.com
        nickname: user1
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.example
        user:
          id: 1
          email: user1@example.com
          nickname: user1
    CreateQuestionRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
      example:
        title: Redis와 read replica는 역할이 어떻게 다른가요?
        content: read-heavy 서비스에서 둘 다 왜 필요한지 궁금합니다.
        tags: [redis, mysql, system-design]
    UpdateQuestionRequest:
      allOf:
        - $ref: '#/components/schemas/CreateQuestionRequest'
      example:
        title: Redis와 read replica의 차이점이 궁금합니다
        content: 캐시와 읽기 저장소 분산의 차이를 설명해주세요.
        tags: [redis, mysql, cache]
    CreateAnswerRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
      example:
        content: Redis는 hot key를 줄이고 replica는 일반 조회 부하를 분산합니다.
    UpdateAnswerRequest:
      allOf:
        - $ref: '#/components/schemas/CreateAnswerRequest'
      example:
        content: Redis는 hot key 처리에, replica는 read scaling에 적합합니다.
    VoteRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [LIKE, DISLIKE, like, dislike]
      example:
        type: LIKE
    AcceptAnswerRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          format: int64
      example:
        questionId: 1
    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
      example:
        reason: 광고성 게시물입니다.
    VoteSummary:
      type: object
      properties:
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
      example:
        likes: 3
        dislikes: 1
    AnswerSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        accepted:
          type: boolean
        author:
          $ref: '#/components/schemas/UserSummary'
        votes:
          $ref: '#/components/schemas/VoteSummary'
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        content: Redis는 hot key 처리에, replica는 read scaling에 적합합니다.
        accepted: true
        author:
          id: 2
          email: user2@example.com
          nickname: user2
        votes:
          likes: 5
          dislikes: 0
        createdAt: "2026-03-23T12:00:00"
    QuestionSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        contentPreview:
          type: string
        tags:
          type: array
          items:
            type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        answerCount:
          type: integer
        acceptedAnswerId:
          type: integer
          format: int64
          nullable: true
        votes:
          $ref: '#/components/schemas/VoteSummary'
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        title: Redis와 read replica는 역할이 어떻게 다른가요?
        contentPreview: read-heavy 서비스에서 둘 다 왜 필요한지 궁금합니다.
        tags: [redis, mysql, system-design]
        author:
          id: 1
          email: user1@example.com
          nickname: user1
        answerCount: 1
        acceptedAnswerId: 1
        votes:
          likes: 3
          dislikes: 1
        createdAt: "2026-03-23T11:00:00"
    QuestionDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        answerCount:
          type: integer
        acceptedAnswerId:
          type: integer
          format: int64
          nullable: true
        votes:
          $ref: '#/components/schemas/VoteSummary'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 1
        title: Redis와 read replica는 역할이 어떻게 다른가요?
        content: read-heavy 서비스에서 둘 다 왜 필요한지 궁금합니다.
        tags: [redis, mysql, system-design]
        author:
          id: 1
          email: user1@example.com
          nickname: user1
        answerCount: 1
        acceptedAnswerId: 1
        votes:
          likes: 3
          dislikes: 1
        answers:
          - id: 1
            content: Redis는 hot key 처리에, replica는 read scaling에 적합합니다.
            accepted: true
            author:
              id: 2
              email: user2@example.com
              nickname: user2
            votes:
              likes: 5
              dislikes: 0
            createdAt: "2026-03-23T12:00:00"
        createdAt: "2026-03-23T11:00:00"
        updatedAt: "2026-03-23T12:30:00"
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        referenceId:
          type: integer
          format: int64
        referenceType:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        message: 내 질문에 새 답변이 등록되었습니다.
        referenceId: 1
        referenceType: QUESTION
        read: false
        createdAt: "2026-03-23T12:00:05"
    UserProfileResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        myQuestions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSummary'
        myAnswers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerSummary'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
    QuestionSearchResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        contentSnippet:
          type: string
        tags:
          type: array
          items:
            type: string
        authorNickname:
          type: string
        answerCount:
          type: integer
        acceptedAnswerId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        title: Redis와 read replica는 역할이 어떻게 다른가요?
        contentSnippet: read-heavy 서비스에서 둘 다 왜 필요한지 궁금합니다.
        tags: [redis, mysql, system-design]
        authorNickname: user1
        answerCount: 1
        acceptedAnswerId: 1
        createdAt: "2026-03-23T11:00:00"
security:
  - bearerAuth: []
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/questions:
    post:
      tags: [Questions]
      summary: 질문 작성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetailResponse'
    get:
      tags: [Questions]
      summary: 질문 목록 조회
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionSummary'
  /api/questions/{questionId}:
    get:
      tags: [Questions]
      summary: 질문 상세 조회
      security: []
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetailResponse'
    put:
      tags: [Questions]
      summary: 질문 수정
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetailResponse'
    delete:
      tags: [Questions]
      summary: 질문 삭제
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/questions/{questionId}/answers:
    post:
      tags: [Questions]
      summary: 답변 작성
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnswerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSummary'
  /api/questions/{questionId}/vote:
    post:
      tags: [Questions]
      summary: 질문 좋아요 또는 싫어요
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
  /api/questions/{questionId}/report:
    post:
      tags: [Questions]
      summary: 질문 신고
      parameters:
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: OK
  /api/answers/{answerId}:
    put:
      tags: [Answers]
      summary: 답변 수정
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnswerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSummary'
    delete:
      tags: [Answers]
      summary: 답변 삭제
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/answers/{answerId}/accept:
    post:
      tags: [Answers]
      summary: 답변 채택
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAnswerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSummary'
  /api/answers/{answerId}/vote:
    post:
      tags: [Answers]
      summary: 답변 좋아요 또는 싫어요
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
  /api/answers/{answerId}/report:
    post:
      tags: [Answers]
      summary: 답변 신고
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: OK
  /api/search/questions:
    get:
      tags: [Search]
      summary: 질문 검색
      security: []
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          example: Redis
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: [redis, mysql]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionSearchResponse'
  /api/profiles/me:
    get:
      tags: [Profiles]
      summary: 내 프로필 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
